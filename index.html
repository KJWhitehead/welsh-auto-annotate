  }

  .tooltip {
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s;
    position: absolute;
    bottom: 120%;
    left: 0;
    background: #333;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  .annotated:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }

// --- SAFE WELSH MUTATION NORMALISATION ---
function normalise(word, glossary) {
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F]+|[^\w\u00C0-\u017F]+$/g, "");

  // 1. Try exact match
  if (glossary[w]) return w;

  // 2. Soft mutation reversals
  const soft = {
    "f": "b",
    "dd": "d",
    "g": "c",
    "ph": "p",
    "th": "t"
  };
  for (const mut in soft) {
    if (w.startsWith(mut)) {
      const candidate = w.replace(new RegExp("^" + mut), soft[mut]);
      if (glossary[candidate]) return candidate;
    }
  }

  // 3. Nasal mutation reversals
  const nasal = {
    "mh": "m",
    "nh": "n",
    "ngh": "c",
    "ng": "g"
  };
  for (const mut in nasal) {
    if (w.startsWith(mut)) {
      const candidate = w.replace(new RegExp("^" + mut), nasal[mut]);
      if (glossary[candidate]) return candidate;
    }
  }

  // 4. Aspirate mutation reversals
  const aspirate = {
    "ch": "c",
    "ll": "l",
    "rh": "r"
  };
  for (const mut in aspirate) {
    if (w.startsWith(mut)) {
      const candidate = w.replace(new RegExp("^" + mut), aspirate[mut]);
      if (glossary[candidate]) return candidate;
    }
  }

  // 5. No match found
  return w;
}


// --- AUTO‑ANNOTATION ENGINE WITH MUTATION SUPPORT ---
function annotate(text, glossary) {
  // Splits text into words while keeping punctuation separated, supporting Welsh characters
  const words = text.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF]+)/g);
  
  return words.map(word => {
    // If it's a structural whitespace or punctuation snippet, don't try to normalise it
    if (!/[a-zA-Z\u00C0-\u017F\u1E00-\u1EFF]/.test(word)) {
      return word;
    }

    const clean = normalise(word, glossary);
    if (glossary[clean]) {
      return `
        <span class="annotated">${word}<span class="tooltip">${glossary[clean]}</span></span>`;
    }
    return word;
  }).join("");
}


// --- RUN ANNOTATION ---

  document.getElementById("output").innerHTML = annotate(text, glossary);

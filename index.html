<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">
<title>Welsh Auto‑Annotation Tool</title>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    line-height: 1.6;
  }

  textarea {
    width: 100%;
    height: 150px;
    font-size: 1em;
    margin-bottom: 10px;
  }

  button {
    padding: 8px 16px;
    font-size: 1em;
    cursor: pointer;
  }

  .annotated {
    position: relative;
    cursor: help;
    border-bottom: 1px dotted #888;
  }

  .tooltip {
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s;
    position: absolute;
    bottom: 120%;
    left: 0;
    background: #333;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  .annotated:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }
</style>
</head>

<body>

<h2>Welsh Auto‑Annotation Tool</h2>

<p>Paste any Welsh text below and click <strong>Annotate</strong>:</p>

<textarea id="inputText" placeholder="Rhowch eich testun Cymraeg yma..."></textarea>
<button onclick="runAnnotation()">Annotate</button>

<div id="output"></div>

<script>
// --- YOUR WELSH GLOSSARY ---
const glossary = {
  "gofalodd": "He took care / made sure",
  "mynd": "To go",
  "gweld": "To see",
  "parc": "Park",
  "boced": "Pocket",
  "sâl": "Ill / sick"
};

// --- AUTO‑ANNOTATION ENGINE ---
function annotate(text, glossary) {
  const words = text.split(/\b/);
  return words.map(word => {
    const clean = word.toLowerCase();
    if (glossary[clean]) {
      return `
        <span class="annotated">${word}
          <span class="tooltip">${glossary[clean]}</span>
        </span>`;
    }
    return word;
  }).join("");
}

// --- RUN ANNOTATION ---
function runAnnotation() {
  const text = document.getElementById("inputText").value;
  document.getElementById("output").innerHTML = annotate(text, glossary);
}
</script>

</body>
</html>

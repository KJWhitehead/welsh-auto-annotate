<script>
  (async function loadDictionaries() {
    // Relative paths to your modern JSON files
    const files = {
      mynediadGlossary: 'dictionaries/mynediad.json',
      sylfaenGlossary: 'dictionaries/sylfaen.json',
      canolraddGlossary: 'dictionaries/canolradd.json',
      bbcGlossary: 'dictionaries/bbc.json'
    };

    for (const [globalName, path] of Object.entries(files)) {
      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        // Bind the clean data directly to the global window context
        window[globalName] = await response.json();
      } catch (error) {
        console.error(`Failed to load local dictionary from ${path}:`, error);
      }
    }
    
    console.log("✅ All Welsh JSON dictionaries loaded successfully into the window context.");
    
    // Yell to the page that the data is ready to use!
    window.dispatchEvent(new Event('dictionariesReady'));
  })();
</script>

<script>
// Declare your single runtime dictionary globally at the top
let runtimeGlossary = {};

// THE BARRICADE: Safe execution guard waiting for the loader's signal
window.addEventListener('dictionariesReady', () => {
  console.log("🚀 Signal received! Compiling initial active runtime glossary...");
  compileActiveGlossary();
});

// GLOSSARY PARSING ENGINE
function compileActiveGlossary() {
  runtimeGlossary = {};

  const useMynediad = document.getElementById('chkMynediad').checked;
  const useSylfaen = document.getElementById('chkSylfaen').checked;
  const useCanolradd = document.getElementById('chkCanolradd').checked;
  const useBBC = document.getElementById('chkBBC').checked;

  function mergeSource(sourceGlossary) {
    if (!sourceGlossary || typeof sourceGlossary !== 'object') return;

    for (const key in sourceGlossary) {
      const cleanKey = key.trim().toLowerCase();
      const rawData = sourceGlossary[key];

      let textTranslation = "";
      let courseInfo = "";

      // Smart hybrid check for object containers or flat strings
      if (rawData && typeof rawData === 'object' && 'definition' in rawData) {
        textTranslation = rawData.definition;
        if (rawData.course && rawData.unit) {
          courseInfo = ` [${rawData.course} • ${rawData.unit}]`;
        }
      } else {
        textTranslation = rawData;
      }

      const finalDisplayString = textTranslation + courseInfo;

      if (runtimeGlossary[cleanKey]) {
        const currentDefs = runtimeGlossary[cleanKey].split(" / ");
        if (!currentDefs.includes(finalDisplayString)) {
          runtimeGlossary[cleanKey] += " / " + finalDisplayString;
        }
      } else {
        runtimeGlossary[cleanKey] = finalDisplayString;
      }
    }
  }

  // Safely merge checkboxes to global variables populated by the fetch script
  if (useMynediad) mergeSource(window.mynediadGlossary);
  if (useSylfaen) mergeSource(window.sylfaenGlossary);
  if (useCanolradd) mergeSource(window.canolraddGlossary);
  if (useBBC) mergeSource(window.bbcGlossary);

  console.log("📊 Active glossary compiled. Total terms:", Object.keys(runtimeGlossary).length);
}

// --- AUTO-COLLECT MULTIPLE MATCHES & MUTATIONS ---
function collectMatches(word, glossary) {
  // FIXED: Explicitly preserves straight and curly apostrophes during word cleanup!
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F\u1E00-\u1EFF'’]+|[^\w\u00C0-\u017F\u1E00-\u1EFF'’]+$/g, "").trim();
  if (!w) return [];

  // 1. WELSH CONTRACTION SPLITTER
  // Only trim context attachments if the absolute contraction isn't explicitly in the glossary first!
  if (!glossary[w]) {
    if (w.endsWith("'r") || w.endsWith("’r") || w.endsWith("'n") || w.endsWith("’n")) {
      w = w.slice(0, -2); 
    }
  }

  // 2. WELSH VOWEL-LINK STRIPPER
  if (!glossary[w]) {
    const vowelLinks = { "nag": "na", "ac": "a", "ag": "â", "tuag": "tua", "gydag": "gyda" };
    if (vowelLinks[w]) w = vowelLinks[w];
  }

 if (!w) return [];
  let foundKeys = new Set();

  function checkAndAdd(candidate) {
    if (glossary[candidate]) foundKeys.add(candidate);
    if (/[aeiouwŷâêîôû]$/i.test(candidate)) {
      const candidateWithF = candidate + "f";
      if (glossary[candidateWithF]) foundKeys.add(candidateWithF);
    }
  }

  // ─── NEW: ADJECTIVE SUFFIX DETECTION GUARD ──────────────────────────
  // Checks if the word token ends with one of your active suffixes
  const isAdjSuffix = ["ach", "af", "a", "ed"].some(suffix => w.endsWith(suffix) && w.length > suffix.length);

  // FIXED: Only run the direct base pass if this is NOT a word with an adjective suffix!
  if (!isAdjSuffix) {
    checkAndAdd(w);
  }

  function scanMutations(candidate) {
    // Soft Mutations
    const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
    for (const mut in soft) {
      if (candidate.startsWith(mut)) {
        soft[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    // Nasal Mutations
    const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
    for (const mut in nasal) {
      if (candidate.startsWith(mut)) {
        nasal[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    // Aspirate Mutations
    const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
    for (const mut in aspirate) {
      if (candidate.startsWith(mut)) {
        aspirate[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    if (/^[aeiouwŷâêîôû]/i.test(candidate)) checkAndAdd("g" + candidate);

    // ASPIRATE VOWEL PASS
    if (candidate.startsWith("h") && candidate.length > 1) {
      const vowelRoot = candidate.slice(1);
      if (/^[aeiouwŷâêîôû]/i.test(vowelRoot)) checkAndAdd(vowelRoot);
    }
  }

  // FIXED: Only trigger standard mutation sweeps if it wasn't intercepted as a suffix word!
  if (!isAdjSuffix) {
    scanMutations(w);
  }

  // 3. VERB STEM SUFFIX STRIPPER
  const verbSuffixes = ["odd", "ais", "es", "aeth", "on", "och", "asant", "wch", "a"];
  for (const suffix of verbSuffixes) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      checkAndAdd(nakedStem);
      scanMutations(nakedStem);

      const infinitiveEndings = ["u", "i", "o", "io", "a"];
      for (const inf of infinitiveEndings) {
        let reconstructedVerb = nakedStem + inf;
        checkAndAdd(reconstructedVerb);
        scanMutations(reconstructedVerb);
      }
    }
  }
 // 4. FIXED LOCATION: ADJECTIVE COMPARATIVE / SUPERLATIVE Suffix Stripper
  // Targets regular endings, including modern spoken dropped-f superlatives!
  const adjSuffixes = { "ach": "comparative", "af": "superlative", "a": "superlative", "ed": "equative" };
  for (const [suffix, formType] of Object.entries(adjSuffixes)) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      
      // We will temporarily intercept found keys to attach the form label to them
      function checkAddWithForm(candidate) {
        if (glossary[candidate]) {
          foundKeys.add(JSON.stringify({ root: candidate, form: formType }));
        }
      }

      // Check standard mutations with the form tag attached
      checkAddWithForm(nakedStem);
      
      // Re-map scanMutations to use our form tracker inside this loop block
      const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
      for (const m in soft) if (nakedStem.startsWith(m)) soft[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));
      
      const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
      for (const m in nasal) if (nakedStem.startsWith(m)) nasal[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));
      
      const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
      for (const m in aspirate) if (nakedStem.startsWith(m)) aspirate[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));

      // Harden stem reversals (e.g., teca -> tec -> teg)
      if (nakedStem.endsWith("c")) { const s = nakedStem.slice(0, -1) + "g"; checkAddWithForm(s); }
      if (nakedStem.endsWith("t")) { const s = nakedStem.slice(0, -1) + "d"; checkAddWithForm(s); }
      if (nakedStem.endsWith("p")) { const s = nakedStem.slice(0, -1) + "b"; checkAddWithForm(s); }
    }
  }
 // --- FIXED: FINAL DE-DUPLICATION FILTER GATE ---
  // Loops through all gathered keys and filters out generic plain roots 
  // if a richer, grammatically tagged version of that same root exists!
  const finalArray = Array.from(foundKeys).map(item => {
    if (item.startsWith("{")) {
      const parsed = JSON.parse(item);
      return { root: parsed.root, definition: glossary[parsed.root], form: parsed.form };
    }
    return { root: item, definition: glossary[item], form: "" };
  });

  // Filter out the plain root if the exact same root exists with a grammar form tag
  return finalArray.filter((item, index, self) => {
    if (item.form === "") {
      // If a tagged version of this exact same root exists anywhere in the array, drop this plain one!
      const hasTaggedVersion = self.some(x => x.root === item.root && x.form !== "");
      if (hasTaggedVersion) return false;
    }
    
    // Also drop absolute identical duplicates
    return self.findIndex(x => x.root === item.root && x.definition === item.definition && x.form === item.form) === index;
  });
}

// --- WORKBENCH ANNOTATION ENGINE ---
function annotate(text, glossary) {
  const phrases = Object.keys(glossary).filter(k => k.includes(" ")).sort((a, b) => b.length - a.length);
  let processedText = text;

  phrases.forEach(phrase => {
    const safePhrase = phrase.replace(/[-\/\\^\$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`(?<=^|[^a-zA-Z\\u00C0-\u017F\\u1E00-\u1EFF])(${safePhrase})(?=$|[^a-zA-Z\\u00C0-\u017F\\u1E00-\u1EFF])`, 'gi');
    processedText = processedText.replace(regex, match => {
      const d = glossary[phrase];
      const txt = (d && typeof d === 'object') ? d.definition : d;
      const c = (d && d.course) ? d.course : "";
      const u = (d && d.unit) ? d.unit : "";
      return `___PHRASE_START___${match}___PHRASE_DIVIDER___${txt}|||${c}|||${u}___PHRASE_END___`;
    });
  });

  const tokens = processedText.split(/(___PHRASE_START___.*?___PHRASE_END___)/g);
  return tokens.map(token => {
    // A. TRACK MULTI-WORD PHRASES
    if (token.startsWith("___PHRASE_START___")) {
      const parts = token.replace("___PHRASE_START___", "").replace("___PHRASE_END___", "").split("___PHRASE_DIVIDER___");
      const localPhraseText = parts[0];
      const dataBits = parts[1].split("|||");
      
      const tooltipHtml = `<span class="tooltip-branch"><span class="tooltip-label">(${localPhraseText}):</span> ${dataBits[0]} [${dataBits[1]} • ${dataBits[2]}]</span>`;
      const cleanParam = encodeURIComponent(JSON.stringify({ word: localPhraseText, def: dataBits[0], course: dataBits[1], unit: dataBits[2] }));
      
      let audioBtn = `<button class="speak-btn" data-text="${localPhraseText}" style="display:block; width:100%; margin-top:4px; padding:4px; font-size:11px; background:#3b82f6; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">🔊 Llafar / Listen</button>`;
      let btn = `<button onclick="handleAddClick(event, '${cleanParam}')" style="display:block; width:100%; margin-top:4px; padding:4px; font-size:11px; background:#10b981; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">➕ Add to Study List</button>`;
      
      return `<span class="annotated" onclick="handleToggle(event, this)">${localPhraseText}<span class="tooltip">${tooltipHtml}${audioBtn}${btn}</span></span>`;
    }

    // B. TRACK INDIVIDUAL SINGLE WORDS
    const words = token.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF\u2019\u0027]+)/g);
    return words.map(word => {
      const matches = collectMatches(word, glossary);
      if (matches.length > 0) {
        let tooltipHtml = matches.map(m => {
          const d = m.definition;
          const txt = (d && typeof d === 'object') ? d.definition : d;
          const c = (d && d.course) ? d.course : "";
          const u = (d && d.unit) ? d.unit : "";
          
          const formLabel = m.form ? ` (${m.form})` : "";
          const curriculum = (c || u) ? ` [${c} ${u ? '• ' + u : ''}]` : "";
          
          return `<span class="tooltip-branch"><span class="tooltip-label">(${m.root}):</span> ${txt}${formLabel}${curriculum}</span>`;
        }).join("");

        const firstMatchObj = matches[0];
        const rawDef = firstMatchObj.definition;
        
        const packedData = {
          word: word,
          def: (rawDef && typeof rawDef === 'object') ? rawDef.definition : rawDef,
          course: (rawDef && typeof rawDef === 'object' && rawDef.course) ? rawDef.course : "",
          unit: (rawDef && typeof rawDef === 'object' && rawDef.unit) ? rawDef.unit : ""
        };
        const cleanParam = encodeURIComponent(JSON.stringify(packedData));
        
        let audioBtn = `<button class="speak-btn" data-text="${word}" style="display:block; width:100%; margin-top:4px; padding:4px; font-size:11px; background:#3b82f6; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">🔊 Llafar / Listen</button>`;
        let btn = `<button onclick="handleAddClick(event, '${cleanParam}')" style="display:block; width:100%; margin-top:4px; padding:4px; font-size:11px; background:#10b981; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">➕ Add to Study List</button>`;
        
        return `<span class="annotated" onclick="handleToggle(event, this)">${word}<span class="tooltip">${tooltipHtml}${audioBtn}${btn}</span></span>`;
      }
      return word;
    }).join("");
  }).join("");
}

// --- INTERACTION & DATA STORAGE PIPELINES ---
function handleToggle(event, el) {
  event.stopPropagation();
  const isOpen = el.classList.contains('show-tooltip');
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
  if (!isOpen) el.classList.add('show-tooltip');
}

function handleAddClick(event, encodedData) {
  event.stopPropagation();
  const data = JSON.parse(decodeURIComponent(encodedData));
  
  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  const matchIdx = loggedWords.findIndex(item => item.word.toLowerCase() === data.word.toLowerCase());
  if (matchIdx !== -1) {
    loggedWords[matchIdx].count += 1;
  } else {
    loggedWords.push({ word: data.word, displayDef: data.def, course: data.course, unit: data.unit, count: 1 });
  }

  localStorage.setItem("welshLocalStudySession", JSON.stringify(loggedWords));
  renderStudyListTable();
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
}

function renderStudyListTable() {
  const tableBody = document.getElementById("studyListBody");
  if (!tableBody) return;

  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  if (loggedWords.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="4" class="empty-msg">No words saved yet. Tap [+] to track.</td></tr>`;
    return;
  }

  tableBody.innerHTML = loggedWords.map(item => {
    const courseText = item.course ? item.course.trim() : "";
    const unitText = item.unit ? item.unit.trim() : "";
    const sourceLabel = (courseText && unitText) ? `${courseText} • ${unitText}` : (courseText || unitText || "");

    return `<tr>
      <td><span class="table-word">${item.word}</span></td>
      <td>${item.displayDef}</td>
      <td>${sourceLabel ? `<span class="unit-tag">\${sourceLabel}</span>` : ""}</td>
      <td style="text-align: center; font-weight: bold; color: #dc3545;">${item.count}×</td>
    </tr>`;
  }).join("");
}

// --- SYSTEM XML EXPORT CONTROLLER ---
function triggerXMLExport() {
  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  if (loggedWords.length === 0) {
    alert("Your study list is currently empty. Add some words first!");
    return;
  }

  let xmlString = `<?xml version="1.0" encoding="UTF-8"?>\n<studylist>\n`;
  loggedWords.forEach(item => {
    xmlString += `  <item>\n`;
    xmlString += `    <word>${escapeXML(item.word)}</word>\n`;
    xmlString += `    <definition>${escapeXML(item.displayDef)}</definition>\n`;
    xmlString += `    <course>${escapeXML(item.course)}</course>\n`;
    xmlString += `    <unit>${escapeXML(item.unit)}</unit>\n`;
    xmlString += `    <count>${item.count}</count>\n`;
    xmlString += `  </item>\n`;
  });
  xmlString += `</studylist>`;

  const blob = new Blob([xmlString], { type: "text/xml" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "welsh_vocabulary_study_list.xml";
  link.click();
}

function escapeXML(str) {
  if (!str) return "";
  return str.toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function runAnnotation() {
  const text = document.getElementById("inputText").value;
  if (!text.trim()) {
    document.getElementById("output").innerHTML = "Please type some Welsh text first.";
    return;
  }
  document.getElementById("output").innerHTML = annotate(text, runtimeGlossary);
}

function clearAnnotation() {
  document.getElementById("inputText").value = "";
  document.getElementById("output").innerHTML = "";
}

function clearStudyList() {
  if (confirm("Are you sure you want to clear your current vocabulary study list?")) {
    localStorage.removeItem("welshLocalStudySession");
    renderStudyListTable();
  }
}

// --- NATIVE WORKBENCH TECHIAITH VOICE CONTROLLER ---
document.addEventListener('click', (event) => {
  const target = event.target;

  if (target.classList.contains('speak-btn')) {
    event.stopPropagation();

    const textToPronounce = target.getAttribute('data-text');
    const originalText = target.innerHTML;
    target.innerHTML = "⏳ Connecting...";

    // 1. SILENT INITIALIZATION PRE-FLIGHT
    // Creates and primes the speaker element directly within the initial human tap window 
    // to instantly satisfy the browser's autoplay interaction guard gates!
    const audioPlayer = new Audio();
    audioPlayer.crossOrigin = "anonymous";

    fetch("https://techiaith.cymru", {
      method: "POST",
      mode: "cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text: String(textToPronounce).trim(),
        speaker_id: "benyw-deheuol-pro"
      })
    })
    .then(response => {
      if (!response.ok) throw new Error("Techiaith web synthesis connection failure.");
      return response.blob();
    })
    .then(blob => {
      // 2. ENHANCED DATA LOADING PIPELINE
      const nativeAudioUrl = URL.createObjectURL(blob);
      
      // Inject the track layout directly into our pre-primed human-authorized player
      audioPlayer.src = nativeAudioUrl;
      audioPlayer.load(); // Forces the browser cache layout memory to buffer the track data completely

      // 3. SECURE PLAYBACK PROMISE TRACKING
      // Explicitly tells Chrome to wake up the speakers now that the data loop is complete
      audioPlayer.play()
        .then(() => {
          target.innerHTML = originalText;
        })
        .catch(playError => {
          console.error("Browser interaction playback block encountered:", playError);
          // If the browser forces a block, fall back to a manual window notice
          target.innerHTML = "🔊 Click Again to Hear";
          setTimeout(() => { target.innerHTML = originalText; }, 2000);
        });
    })
    .catch(error => {
      console.error("Workbench Voice Engine Error:", error);
      target.innerHTML = "❌ Audio Unavailable";
      setTimeout(() => { target.innerHTML = originalText; }, 1500);
    });
    return;
  }

  // Dismiss all tooltips on general outside clicks
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
});

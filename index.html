<!-- EXTERNAL GLOSSARIES-->
<script>
// Master registries targeting raw data profiles cleanly
let loadedDictionaries = {}; 
let runtimeGlossary = {};    

// 🔄 Dynamic Recompilation Engine: Retains full data objects in real-time!
function recompileGlossary() {
  runtimeGlossary = {}; // Wipe active cache clean

  const checkboxMapping = [
  { id: 'chkMynediad', key: 'mynediadGlossary' },
  { id: 'chkSylfaen', key: 'sylfaenGlossary' },
  { id: 'chkCanolradd', key: 'canolraddGlossary' },
  { id: 'chkUwch1', key: 'uwch1Glossary' },
  { id: 'chkBBC', key: 'bbcGlossary' }
];

  let activeSetCount = 0;

  checkboxMapping.forEach(track => {
    const el = document.getElementById(track.id);
    
    if (el && el.checked && loadedDictionaries[track.key]) {
      const activeFile = loadedDictionaries[track.key];
      
      // deep copy entries
      for (const [termKey, termValue] of Object.entries(activeFile)) {
        if (termValue && typeof termValue === 'object') {
          runtimeGlossary[termKey] = {
            definition: termValue.definition || "",
            course: termValue.course || "",
            unit: termValue.unit || ""
          };
        } else {
          // Fallback wrapper for old, flat string dictionary layouts
          runtimeGlossary[termKey] = {
            definition: termValue,
            course: "",
            unit: ""
          };
        }
      }
      activeSetCount++;
    }
  });

  const termCount = Object.keys(runtimeGlossary).length;
  console.log(`🔄 Glossary compiled structurally! Active sets: ${activeSetCount}. Total terms: ${termCount}`);
}

// Initial bootstrap script loader routine
(async function initGlossaryPipeline() {
  const files = {
    mynediadGlossary: 'dictionaries/mynediad.json',
    sylfaenGlossary: 'dictionaries/sylfaen.json',
    canolraddGlossary: 'dictionaries/canolradd.json',
uwch1Glossary: 'dictionaries/uwch1.json',
    bbcGlossary: 'dictionaries/bbc.json'
  };

  for (const [globalName, path] of Object.entries(files)) {
    try {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      loadedDictionaries[globalName] = await response.json();
      window[globalName] = loadedDictionaries[globalName]; 
    } catch (error) {
      console.error(`Failed to load local dictionary from ${path}:`, error);
    }
  }
  
  console.log("✅ All Welsh JSON dictionaries loaded successfully into background registries.");
  
  recompileGlossary();

  ['chkMynediad', 'chkSylfaen', 'chkCanolradd', 'chkUwch1', 'chkBBC'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', recompileGlossary);
    }
  });

  window.dispatchEvent(new Event('dictionariesReady'));
})();
</script>

<script>

// GLOSSARY PARSING ENGINE
function compileActiveGlossary() {
  runtimeGlossary = {};

  const useMynediad = document.getElementById('chkMynediad').checked;
  const useSylfaen = document.getElementById('chkSylfaen').checked;
  const useCanolradd = document.getElementById('chkCanolradd').checked;
const useUwch1 = document.getElementById('chkUwch1').checked;
  const useBBC = document.getElementById('chkBBC').checked;

  function mergeSource(sourceGlossary) {
    if (!sourceGlossary || typeof sourceGlossary !== 'object') return;

    for (const key in sourceGlossary) {
      const cleanKey = key.trim().toLowerCase();
      const rawData = sourceGlossary[key];

      let textTranslation = "";
      let courseText = "";
      let unitText = "";

      // Unpack object containers or flat strings cleanly
      if (rawData && typeof rawData === 'object' && 'definition' in rawData) {
        textTranslation = rawData.definition || "";
        courseText = rawData.course || "";
        unitText = rawData.unit || "";
      } else {
        textTranslation = rawData || "";
      }

      if (runtimeGlossary[cleanKey]) {
        // If the term already exists, append the new definition cleanly with a slash divider
        const currentDefs = runtimeGlossary[cleanKey].definition.split(" / ");
        if (!currentDefs.includes(textTranslation)) {
          runtimeGlossary[cleanKey].definition += " / " + textTranslation;
        }
        // Retain the course and unit strings if they aren't already set
        if (!runtimeGlossary[cleanKey].course) runtimeGlossary[cleanKey].course = courseText;
        if (!runtimeGlossary[cleanKey].unit) runtimeGlossary[cleanKey].unit = unitText;
      } else {
        // 🛠️ FIXED: Keep the entry explicitly as an object structure!
        runtimeGlossary[cleanKey] = {
          definition: textTranslation,
          course: courseText,
          unit: unitText
        };
      }
    }
  }

  // Safely merge checkboxes to global variables populated by the fetch script
  if (useMynediad) mergeSource(window.mynediadGlossary);
  if (useSylfaen) mergeSource(window.sylfaenGlossary);
  if (useCanolradd) mergeSource(window.canolraddGlossary);
if (useUwch1) mergeSource(window.uwch1Glossary);
  if (useBBC) mergeSource(window.bbcGlossary);

  console.log("📊 Active glossary compiled structurally. Total terms:", Object.keys(runtimeGlossary).length);
}

        
// --- AUTO-COLLECT MULTIPLE MATCHES & MUTATIONS ---
function collectMatches(word, glossary) {
  // FIXED: Explicitly preserves straight and curly apostrophes during word cleanup!
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F\u1E00-\u1EFF'’]+|[^\w\u00C0-\u017F\u1E00-\u1EFF'’]+$/g, "").trim();
  if (!w) return [];

// 1. WELSH CONTRACTION SPLITTER
if (!glossary[w]) {

if (w.endsWith("'ch") || w.endsWith("’ch")) {
w = w.slice(0, -3);
} else if (
w.endsWith("'r") || w.endsWith("’r") ||
w.endsWith("'n") || w.endsWith("’n")
) {
w = w.slice(0, -2);
}
}

  // 2. WELSH VOWEL-LINK STRIPPER
  if (!glossary[w]) {
    const vowelLinks = { "nag": "na", "ac": "a", "ag": "â", "tuag": "tua", "gydag": "gyda" };
    if (vowelLinks[w]) w = vowelLinks[w];
  }
        
  let foundKeys = new Set();

  function checkAndAdd(candidate) {
    // 🛠️ THE COMPREHENSIVE BUG FIX:
    // This express lane catches whole verbs (like "defnyddio") AND superlative adjectives 
    // (like "cyntaf") instantly before suffix strippers can damage or skip them!
    if (glossary[candidate]) {
      foundKeys.add(candidate);
    }
    
    // Your existing dropped-f spoken fallback checker continues safely below:
    if (/[aeiouwŷâêîôû]$/i.test(candidate)) {
      const candidateWithF = candidate + "f";
      if (glossary[candidateWithF]) foundKeys.add(candidateWithF);
    }
  }

// Checks if the word token ends with one of your active suffixes
  const isAdjSuffix = ["ach", "af", "a", "ed"].some(suffix => w.endsWith(suffix) && w.length > suffix.length);

  // ─── 🛠️ THE COMPREHENSIVE BUG FIX: ROOT DIRECT PASS ────────────────
  // Check the whole, unmodified word in the glossary FIRST. If it's a real 
  // standalone dictionary word (like "cyntaf"), log it instantly and bypass the suffix trap!
  if (glossary[w]) {
    checkAndAdd(w);
  }

  // Only run the rest of the direct base pass if this is NOT a word with an adjective suffix!
  if (!isAdjSuffix) {
    checkAndAdd(w);
  }

  function scanMutations(candidate) {
    // Soft Mutations
    const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
    for (const mut in soft) {
      if (candidate.startsWith(mut)) {
        soft[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    // Nasal Mutations
    const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
    for (const mut in nasal) {
      if (candidate.startsWith(mut)) {
        nasal[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    // Aspirate Mutations
    const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
    for (const mut in aspirate) {
      if (candidate.startsWith(mut)) {
        aspirate[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    if (/^[aeiouwŷâêîôû]/i.test(candidate)) checkAndAdd("g" + candidate);

    // ASPIRATE VOWEL PASS
    if (candidate.startsWith("h") && candidate.length > 1) {
      const vowelRoot = candidate.slice(1);
      if (/^[aeiouwŷâêîôû]/i.test(vowelRoot)) checkAndAdd(vowelRoot);
    }
  }

  // FIXED: Only trigger standard mutation sweeps if it wasn't intercepted as a suffix word!
  if (!isAdjSuffix) {
    scanMutations(w);
  }

  // 3. VERB STEM SUFFIX STRIPPER
  const verbSuffixes = ["odd", "ais", "es", "aeth", "on", "och", "asant", "wch", "a"];
  for (const suffix of verbSuffixes) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      checkAndAdd(nakedStem);
      scanMutations(nakedStem);

      const infinitiveEndings = ["u", "i", "o", "io", "a"];
      for (const inf of infinitiveEndings) {
        let reconstructedVerb = nakedStem + inf;
        checkAndAdd(reconstructedVerb);
        scanMutations(reconstructedVerb);
      }
    }
  }
// 4. FIXED LOCATION: ADJECTIVE COMPARATIVE / SUPERLATIVE Suffix Stripper
  const adjSuffixes = { "ach": "comparative", "af": "superlative", "a": "superlative", "ed": "equative" };
  for (const [suffix, formType] of Object.entries(adjSuffixes)) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      
      function checkAddWithForm(candidate) {
        if (glossary[candidate]) {
          foundKeys.add(JSON.stringify({ root: candidate, form: formType }));
        }
        // 🌟 DROPPED-F VARIANT SAFEGUARD: If the stem has a dictionary counterpart ending in -f, catch it!
        if (/[aeiouwŷâêîôû]$/i.test(candidate)) {
          const candidateWithF = candidate + "f";
          if (glossary[candidateWithF]) {
            foundKeys.add(JSON.stringify({ root: candidateWithF, form: formType }));
          }
        }
      }

      // Check standard mutations with the form tag attached
      checkAddWithForm(nakedStem);
      
      // Re-map scanMutations to use our form tracker inside this loop block
      const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
      for (const m in soft) if (nakedStem.startsWith(m)) soft[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));
      
      const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
      for (const m in nasal) if (nakedStem.startsWith(m)) nasal[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));
      
      const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
      for (const m in aspirate) if (nakedStem.startsWith(m)) aspirate[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));

      // Harden stem reversals (e.g., teca -> tec -> teg)
      if (nakedStem.endsWith("c")) { const s = nakedStem.slice(0, -1) + "g"; checkAddWithForm(s); }
      if (nakedStem.endsWith("t")) { const s = nakedStem.slice(0, -1) + "d"; checkAddWithForm(s); }
      if (nakedStem.endsWith("p")) { const s = nakedStem.slice(0, -1) + "b"; checkAddWithForm(s); }
    }
  }
 // --- FIXED: FINAL DE-DUPLICATION FILTER GATE ---
  // Loops through all gathered keys and filters out generic plain roots 
  // if a richer, grammatically tagged version of that same root exists!
  const finalArray = Array.from(foundKeys).map(item => {
    if (item.startsWith("{")) {
      const parsed = JSON.parse(item);
      return { root: parsed.root, definition: glossary[parsed.root], form: parsed.form };
    }
    return { root: item, definition: glossary[item], form: "" };
  });

  // Filter out the plain root if the exact same root exists with a grammar form tag
  return finalArray.filter((item, index, self) => {
    if (item.form === "") {
      // If a tagged version of this exact same root exists anywhere in the array, drop this plain one!
      const hasTaggedVersion = self.some(x => x.root === item.root && x.form !== "");
      if (hasTaggedVersion) return false;
    }
    
    // Also drop absolute identical duplicates
    return self.findIndex(x => x.root === item.root && x.definition === item.definition && x.form === item.form) === index;
  });
}

// --- WORKBENCH ANNOTATION ENGINE ---
function annotate(text, glossary) {
  const phrases = Object.keys(glossary)
    .filter(k => k.includes(" "))
    .sort((a, b) => b.length - a.length);

  let processedText = text;

  if (phrases.length > 0) {
    const phraseLookup = Object.fromEntries(
      phrases.map(phrase => [phrase.toLowerCase(), phrase])
    );

    const escapedPhrases = phrases.map(phrase =>
      phrase.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&")
    );

    const phraseRegex = new RegExp(
      `(?<=^|[^a-zA-Z\\u00C0-\\u017F\\u1E00-\\u1EFF])` +
      `(${escapedPhrases.join("|")})` +
      `(?=$|[^a-zA-Z\\u00C0-\\u017F\\u1E00-\\u1EFF])`,
      "gi"
    );

    processedText = processedText.replace(phraseRegex, match => {
      const glossaryKey = phraseLookup[match.toLowerCase()];
      const d = glossary[glossaryKey];

      const txt = d && typeof d === "object" ? d.definition : d;
      const c = d && d.course ? d.course : "";
      const u = d && d.unit ? d.unit : "";

      return `___PHRASE_START___${match}` +
        `___PHRASE_DIVIDER___${txt}|||${c}|||${u}` +
        `___PHRASE_END___`;
    });
  }

  const tokens = processedText.split(
    /(___PHRASE_START___.*?___PHRASE_END___)/g
  );

  return tokens.map(token => {
    
    // A. TRACK MULTI-WORD PHRASES
    if (token.startsWith("___PHRASE_START___")) {
      const parts = token.replace("___PHRASE_START___", "").replace("___PHRASE_END___", "").split("___PHRASE_DIVIDER___");
      const phraseText = parts[0];
      const dataBits = parts[1].split("|||");
      
      const tooltipHtml = `<span class="tooltip-branch"><span class="tooltip-label">(${phraseText}):</span> ${dataBits[0]} [${dataBits[1]} • ${dataBits[2]}]</span>`;
      const cleanParam = encodeURIComponent(JSON.stringify({ word: phraseText, def: dataBits[0], course: dataBits[1], unit: dataBits[2] }));
      
      let audioBtn = `<button class="speak-btn" data-text="${phraseText}" style="display:block; width:100%; margin-top:4px; padding:4px; font-size:11px; background:#3b82f6; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">🔊 Llafar / Listen</button>`;
      let btn = `<button onclick="handleAddClick(event, '${cleanParam}')" style="display:block; width:100%; margin-top:4px; padding:4px; font-size:11px; background:#10b981; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">➕ Add to Study List</button>`;
      
      return `<span class="annotated" onclick="handleToggle(event, this)">${phraseText}<span class="tooltip">${tooltipHtml}${audioBtn}${btn}</span></span>`;
    }

    // B. TRACK INDIVIDUAL SINGLE WORDS
    // 🛠️ FIXED: Added "\-"  curly and straight apostrophes!
    // This stops the regex engine from breaking hyphenated words like "pen-blwydd" apart!
    const words = token.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF]+(?:['’\-][a-zA-Z\u00C0-\u017F\u1E00-\u1EFF]+)*)/g);
return words.map(word => {
  const matches = collectMatches(word, glossary) || [];

  if (matches.length === 0) {
    return word;
  }

  const tooltipHtml = matches.map(match => {
    const definition = match.definition;

    const definitionText =
      definition && typeof definition === "object"
        ? definition.definition || ""
        : definition || "";

    const course =
      definition && typeof definition === "object"
        ? definition.course || ""
        : "";

    const unit =
      definition && typeof definition === "object"
        ? definition.unit || ""
        : "";

    const formLabel = match.form
      ? ` (${match.form})`
      : "";

    const curriculum = course || unit
      ? ` [${course}${unit ? ` • ${unit}` : ""}]`
      : "";

    const packedData = {
  word,
  root: match.root,
  def: definitionText,
  course,
  unit
};

    const cleanParam = encodeURIComponent(
      JSON.stringify(packedData)
    );

    /*
     * Each match gets its own button and its own encoded data.
     *
     * &quot; is used around cleanParam so Welsh apostrophes in a word
     * cannot break the inline onclick attribute.
     */
    const addButton = `
      <button
        class="study-btn"
        onclick="handleAddClick(event, &quot;${cleanParam}&quot;)"
        style="
          display: block;
          width: 100%;
          margin-top: 4px;
          padding: 4px;
          font-size: 11px;
          background: #10b981;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Add “${match.root}” to study list
      </button>
    `;

    return `
      <span class="tooltip-branch">
        <span class="tooltip-label">
          (${match.root}):
        </span>
        ${definitionText}${formLabel}${curriculum}
        ${addButton}
      </span>
    `;
  }).join("");

  const audioButton = `
    <button
      class="speak-btn"
      data-text="${word}"
      style="
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 4px;
        font-size: 11px;
        background: #3b82f6;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      "
    >
      🔊 Hear word
    </button>
  `;

  return `
    <span
      class="annotated"
      onclick="handleToggle(event, this)"
    >
      ${word}
      <span class="tooltip">
        ${tooltipHtml}
        ${audioButton}
      </span>
    </span>
  `;
}).join("");
  }).join("");
}

// --- INTERACTION & DATA STORAGE PIPELINES ---
function handleToggle(event, el) {
  // 🛠️ THE MASTER INTERCEPTION GUARD:
  // If the user is trying to click the audio button or the add button, 
  // forcefully block the parent span from toggling or closing the tooltip!
  if (event.target.classList.contains('speak-btn') || event.target.tagName === 'BUTTON') {
    return; // Stop right here, let the button handle its own click event!
  }

  event.stopPropagation();
  const isOpen = el.classList.contains('show-tooltip');
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
  if (!isOpen) el.classList.add('show-tooltip');
}

function handleAddClick(event, encodedData) {
  event.stopPropagation();
  const data = JSON.parse(decodeURIComponent(encodedData));
  
  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  const matchIdx = loggedWords.findIndex(item =>
  (item.word || "").toLowerCase() ===
    (data.word || "").toLowerCase() &&
  (item.root || "").toLowerCase() ===
    (data.root || data.word || "").toLowerCase() &&
  (item.displayDef || "") === (data.def || "") &&
  (item.course || "") === (data.course || "") &&
  (item.unit || "") === (data.unit || "")
);
  if (matchIdx !== -1) {
    loggedWords[matchIdx].count += 1;
  } else {
    loggedWords.push({
  word: data.word,
  root: data.root || data.word,
  displayDef: data.def || "",
  course: data.course || "",
  unit: data.unit || "",
  count: 1
});
  }

  localStorage.setItem("welshLocalStudySession", JSON.stringify(loggedWords));
  renderStudyListTable();
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
}

function renderStudyListTable() {
  const tableBody = document.getElementById("studyListBody");
  if (!tableBody) return;

  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  if (loggedWords.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="4" class="empty-msg">No words saved yet. Tap [+] to track.</td></tr>`;
    return;
  }

  tableBody.innerHTML = loggedWords.map(item => {
    const courseText = item.course ? item.course.trim() : "";
    const unitText = item.unit ? item.unit.trim() : "";
    const sourceLabel = (courseText && unitText) ? `${courseText} • ${unitText}` : (courseText || unitText || "");

return `<tr>
  <td>
    <span class="table-word">${item.word}</span>
  </td>
  <td>
    <strong>${item.root || item.word}</strong>
    <br>
    ${item.displayDef || ""}
  </td>
  <td>
    ${sourceLabel
      ? `<span class="unit-tag">${sourceLabel}</span>`
      : ""}
  </td>
  <td style="text-align: center; font-weight: bold; color: #dc3545;">
    ${item.count}×
  </td>
</tr>`;
  }).join("");
}

// --- SYSTEM XML EXPORT CONTROLLER ---
function triggerXMLExport() {
  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  // 🛠️ FIXED: Replaced the undefined tableBody reference with a clean, defensive native alert!
  if (loggedWords.length === 0) {
    alert("Your vocabulary study list is currently empty. Add some words first!");
    return;
  }

  let xmlString = `<?xml version="1.0" encoding="UTF-8"?>\n<studylist>\n`;
  loggedWords.forEach(item => {
    xmlString += `  <item>\n`;
    xmlString += `    <word>${escapeXML(item.word)}</word>\n`;
    xmlString += `    <definition>${escapeXML(item.displayDef)}</definition>\n`;
    xmlString += `    <course>${escapeXML(item.course)}</course>\n`;
    xmlString += `    <unit>${escapeXML(item.unit)}</unit>\n`;
    xmlString += `    <count>${item.count}</count>\n`;
    xmlString += `  </item>\n`;
  });
  xmlString += `</studylist>`;

  const blob = new Blob([xmlString], { type: "text/xml" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "welsh_vocabulary_study_list.xml";
  link.click();
}

function escapeXML(str) {
  if (!str) return "";
  return str.toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function runAnnotation() {
  const text = document.getElementById("inputText").value;
  if (!text.trim()) {
    document.getElementById("output").innerHTML = "Please type some Welsh text first.";
    return;
  }
  // This uses runtimeGlossary perfectly to track checkbox state adjustments!
  document.getElementById("output").innerHTML = annotate(text, runtimeGlossary);
}

function clearAnnotation() {
  document.getElementById("inputText").value = "";
  document.getElementById("output").innerHTML = "";
}

function clearStudyList() {
  if (confirm("Are you sure you want to clear your current vocabulary study list?")) {
    localStorage.removeItem("welshLocalStudySession");
    renderStudyListTable();
  }
}

// --- NATIVE WORKBENCH TECHIAITH VOICE CONTROLLER ---
document.addEventListener('click', (event) => {
  const target = event.target;

  if (target.classList.contains('speak-btn')) {
    event.stopPropagation();

    const textToPronounce = target.getAttribute('data-text');
    const originalText = target.innerHTML;
    target.innerHTML = "⏳ Connecting...";

    const audioPlayer = new Audio();

    fetch("https://api.techiaith.cymru/speak/v3/api/orpheus", {
      method: "POST",
      mode: "cors",
      headers: {
        "Content-Type": "application/json",
        "Accept": "audio/wav"
      },
      body: JSON.stringify({
        text: String(textToPronounce).trim(),
        speaker_id: "benyw-deheuol-pro"
      })
    })
    .then(async response => {
      const contentType = response.headers.get("content-type") || "";
      const body = await response.arrayBuffer();

      if (!response.ok) {
        const errorText = new TextDecoder().decode(body);
        throw new Error(
          `TTS request failed: ${response.status} ${response.statusText}\n${errorText}`
        );
      }

      if (!contentType.startsWith("audio/")) {
        const responseText = new TextDecoder().decode(body);
        throw new Error(
          `Expected audio but received ${contentType}: ${responseText}`
        );
      }

      return new Blob([body], { type: contentType });
    })
    .then(audioBlob => {
      const nativeAudioUrl = URL.createObjectURL(audioBlob);
      audioPlayer.src = nativeAudioUrl;

      // 🛠️ FIXED: Wait until the word finishes speaking before cleaning up the URL memory!
      audioPlayer.onended = () => {
        URL.revokeObjectURL(nativeAudioUrl);
      };

      return audioPlayer.play();
    })
    .then(() => {
      target.innerHTML = originalText;
    })
    .catch(error => {
      console.error("Workbench Voice Engine Error:", error);
      target.innerHTML = "❌ Audio Unavailable";

      setTimeout(() => {
        target.innerHTML = originalText;
      }, 1500);
    });

    return;
  }

  // Dismiss all tooltips on general outside clicks
  document.querySelectorAll('.annotated').forEach(x => {
    x.classList.remove('show-tooltip');
  });
});

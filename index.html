<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">
<title>Welsh Auto‑Annotation Tool</title>

<!-- LINK YOUR EXTERNAL GLOSSARIES HERE -->
<script src="mynediad.js"></script>
<script src="sylfaen.js"></script>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    line-height: 1.6;
    padding: 0 20px;
  }

  .control-panel {
    background: #f4f6f9;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    margin-bottom: 20px;
  }

  .checkbox-group {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: normal;
    cursor: pointer;
    font-size: 1em;
  }

  .checkbox-label input {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    height: 150px;
    font-size: 1em;
    margin-bottom: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px;
  }

  .btn-primary {
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    background-color: #0056b3;
    color: white;
    border: none;
    border-radius: 4px;
    margin-bottom: 20px;
  }

  .btn-primary:hover {
    background-color: #004085;
  }

  .annotated {
    position: relative;
    cursor: help;
    border-bottom: 1px dotted #888;
  }

  .tooltip {
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s;
    position: absolute;
    bottom: 120%;
    left: 0;
    background: #333;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  .annotated:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }
  
  label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
  }
</style>
</head>

<body>

<h2>Welsh Auto‑Annotation Tool</h2>

<!-- CLEAN, UNAMBIGUOUS CHECKBOX CONTROL PANEL -->
<div class="control-panel">
  <label>Select Vocabulary Levels to Include:</label>
  <div class="checkbox-group">
    <label class="checkbox-label">
      <input type="checkbox" id="chkMynediad" checked> Mynediad (Entry level)
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="chkSylfaen" checked> Sylfaen (Foundation level)
    </label>
  </div>
</div>
  
<!-- MAIN TEXT AREA -->
<label for="inputText">Welsh Text to Annotate:</label>
<textarea id="inputText" placeholder="Rhowch eich testun Cymraeg yma..."></textarea>
<button class="btn-primary" onclick="runAnnotation()">Annotate Text</button>

<div id="output"></div>

<script>
// Runtime storage for the dynamically combined glossary
let runtimeGlossary = {};

// Merge active file lists cleanly into a single target dictionary context
function compileActiveGlossary() {
  runtimeGlossary = {};
  
  // Read direct checking states from the native checkbox elements
  const useMynediad = document.getElementById('chkMynediad').checked;
  const useSylfaen = document.getElementById('chkSylfaen').checked;
  
  if (useMynediad && typeof mynediadGlossary !== 'undefined') {
    Object.assign(runtimeGlossary, mynediadGlossary);
  }
  
  if (useSylfaen && typeof sylfaenGlossary !== 'undefined') {
    Object.assign(runtimeGlossary, sylfaenGlossary);
  }
}
  
// --- SAFE WELSH MUTATION & VERB STEM NORMALISATION ---
function normalise(word, glossary) {
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F\u1E00-\u1EFF]+|[^\w\u00C0-\u017F\u1E00-\u1EFF]+$/g, "");

  if (!w) return null;
  if (glossary[w]) return w;

  function findMutationMatch(candidate) {
    const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
    for (const mut in soft) {
      if (candidate.startsWith(mut)) {
        const targets = soft[mut]; 
        for (const target of targets) {
          const root = candidate.replace(new RegExp("^" + mut), target);
          if (glossary[root]) return root;
        }
      }
    }

    const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
    for (const mut in nasal) {
      if (candidate.startsWith(mut)) {
        const targets = nasal[mut];
        for (const target of targets) {
          const root = candidate.replace(new RegExp("^" + mut), target);
          if (glossary[root]) return root;
        }
      }
    }

    const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
    for (const mut in aspirate) {
      if (candidate.startsWith(mut)) {
        const targets = aspirate[mut];
        for (const target of targets) {
          const root = candidate.replace(new RegExp("^" + mut), target);
          if (glossary[root]) return root;
        }
      }
    }

    if (/^[aeiouwŷâêîôû]/i.test(candidate)) {
      const addedG = "g" + candidate;
      if (glossary[addedG]) return addedG;
    }

    return null;
  }

  let mutationMatch = findMutationMatch(w);
  if (mutationMatch) return mutationMatch;

  const verbSuffixes = ["odd", "ais", "es", "aeth", "on", "och", "asant"];
  for (const suffix of verbSuffixes) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      if (glossary[nakedStem]) return nakedStem;
      
      let stemMutationMatch = findMutationMatch(nakedStem);
      if (stemMutationMatch) return stemMutationMatch;

      const infinitiveEndings = ["u", "i", "o", "io", "a"];
      for (const inf of infinitiveEndings) {
        let reconstructedVerb = nakedStem + inf;
        if (glossary[reconstructedVerb]) return reconstructedVerb;
        
        let fuzzyMutationMatch = findMutationMatch(reconstructedVerb);
        if (fuzzyMutationMatch) return fuzzyMutationMatch;
      }
    }
  }

  return null;
}

// --- AUTO‑ANNOTATION ENGINE ---
function annotate(text, glossary) {
  const phrases = Object.keys(glossary).filter(key => key.includes(" "));
  phrases.sort((a, b) => b.length - a.length);

  let processedText = text;

  phrases.forEach(phrase => {
    const safePhrase = phrase.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`\\b(${safePhrase})\\b`, 'gi');
    
    processedText = processedText.replace(regex, (match) => {
      return `___PHRASE_START___${match}___PHRASE_DIVIDER___${glossary[phrase]}___PHRASE_END___`;
    });
  });

  const tokens = processedText.split(/(___PHRASE_START___.*?___PHRASE_END___)/g);
  
  return tokens.map(token => {
    if (token.startsWith("___PHRASE_START___")) {
      const parts = token.replace("___PHRASE_START___", "").replace("___PHRASE_END___", "").split("___PHRASE_DIVIDER___");
      return `<span class="annotated">${parts[0]}<span class="tooltip">${parts[1]}</span></span>`;
    }

    const words = token.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF\u2019\u0027]+)/g);
    return words.map(word => {
      const clean = normalise(word, glossary);
      if (clean && glossary[clean]) {
        return `<span class="annotated">${word}<span class="tooltip">${glossary[clean]}</span></span>`;
      }
      return word;
    }).join("");
  }).join("");
}

// --- RUN ANNOTATION ---
function runAnnotation() {
  compileActiveGlossary(); // Re-read checkboxes right when user hits annotate
  const text = document.getElementById("inputText").value;
  document.getElementById("output").innerHTML = annotate(text, runtimeGlossary);
}
</script>

</body>
</html>

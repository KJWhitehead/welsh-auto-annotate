<style>
  body {
    font-family: sans-serif;

    margin: 40px auto;
    line-height: 1.6;
    padding: 0 20px;
  }

  textarea {
    width: 100%;
    height: 150px;
    font-size: 1em;
    margin-bottom: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px;
  }

  button {
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    background-color: #0056b3;
    color: white;
    border: none;
    border-radius: 4px;
    margin-bottom: 20px;
  }

  button:hover {
    background-color: #004085;
  }

  .annotated {
    position: relative;
    cursor: help;
    border-bottom: 1px dotted #888;
  }

  .tooltip {
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s;
    position: absolute;
    bottom: 120%;
    left: 0;
    background: #333;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  .annotated:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }
  
  label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
  }
</style>
</head>

// --- SAFE WELSH MUTATION & VERB STEM NORMALISATION ---
function normalise(word, glossary) {
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F\u1E00-\u1EFF]+|[^\w\u00C0-\u017F\u1E00-\u1EFF]+$/g, "");

  if (!w) return null;

  // 1. Core lookup helper that matches exact words or their base mutations
  function findMatch(candidate) {
    if (glossary[candidate]) return candidate;

    // Soft mutations
    const soft = { "f": "b", "dd": "d", "g": "c", "ph": "p", "th": "t", "d": "t", "b": "p"};
    for (const mut in soft) {
      if (candidate.startsWith(mut)) {
        const root = candidate.replace(new RegExp("^" + mut), soft[mut]);
        if (glossary[root]) return root;
      }
    }

    // Nasal mutations
    const nasal = { "mh": "m", "nh": "n", "ngh": "c", "ng": "g" };
    for (const mut in nasal) {
      if (candidate.startsWith(mut)) {
        const root = candidate.replace(new RegExp("^" + mut), nasal[mut]);
        if (glossary[root]) return root;
      }
    }

    // Aspirate mutations
    const aspirate = { "ch": "c", "ll": "l", "rh": "r" };
    for (const mut in aspirate) {
      if (candidate.startsWith(mut)) {
        const root = candidate.replace(new RegExp("^" + mut), aspirate[mut]);
        if (glossary[root]) return root;
      }
    }
    return null;
  }

  // 2. Look for an exact match or mutation first
  let directMatch = findMatch(w);
  if (directMatch) return directMatch;

  // 3. Past tense inflections to strip
  const verbSuffixes = ["odd", "ais", "es", "aeth", "on", "och", "asant"];

  for (const suffix of verbSuffixes) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      
      // Check if the stripped stem matches a raw dictionary root directly (like "dilyn")
      let stemMatch = findMatch(nakedStem);
      if (stemMatch) return stemMatch;

      // FUZZY INFINITIVE CHECK (The "Tynnu" fix):
      // If we didn't find the stem, check if adding common infinitive verb-noun endings 
      // results in a valid dictionary word.
      const infinitiveEndings = ["u", "i", "o", "io", "a"];
      for (const inf of infinitiveEndings) {
        let reconstructedVerb = nakedStem + inf;
        let fuzzyMatch = findMatch(reconstructedVerb);
        if (fuzzyMatch) return fuzzyMatch;
      }
    }
  }

  return null;
}

// --- AUTO‑ANNOTATION ENGINE ---
function annotate(text, glossary) {
  const words = text.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF]+)/g);
  
  return words.map(word => {
    const clean = normalise(word, glossary);
    if (clean && glossary[clean]) {
      return `<span class="annotated">${word}<span class="tooltip">${glossary[clean]}</span></span>`;
    }
    return word;
  }).join("");
}

// --- RUN ANNOTATION ---
function runAnnotation() {
  const text = document.getElementById("inputText").value;
  document.getElementById("output").innerHTML = annotate(text, glossary);
}

<!-- EXTERNAL GLOSSARIES-->
<script>
  (async function loadDictionaries() {
    // Relative paths to your modern JSON files
    const files = {
      mynediadGlossary: 'dictionaries/mynediad.json',
      sylfaenGlossary: 'dictionaries/sylfaen.json',
      canolraddGlossary: 'dictionaries/canolradd.json',
      bbcGlossary: 'dictionaries/bbc.json'
    };

    for (const [globalName, path] of Object.entries(files)) {
      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        // Bind the clean data directly to the global window context
        window[globalName] = await response.json();
      } catch (error) {
        console.error(`Failed to load local dictionary from ${path}:`, error);
      }
    }
    
    console.log("✅ All Welsh JSON dictionaries loaded successfully into the window context.");
    
    // Yell to the page that the data is ready to use!
    window.dispatchEvent(new Event('dictionariesReady'));
  })();
</script>


</head>

<body>

<div style="display: flex; align-items: center; gap: 15px; margin-top: 10px; margin-bottom: 25px;">

<div class="control-panel">

  <div class="checkbox-group">

      <input type="checkbox" id="chkBBC"> BBC News Vocab
    </label>
  </div>
</div>

<!-- MAIN TEXT AREA -->
<label for="inputText">Welsh Text to Annotate:</label>
<textarea id="inputText" lang="cy" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off" placeholder="Rhowch eich testun Cymraeg yma..."></textarea>

<!-- LAYER 3: DYNAMIC STUDY LIST VIEW (UPDATED FOR 3 COLUMNS) -->
<div class="study-list-container">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dee2e6; padding-bottom: 8px;">
    <h3 style="margin: 0;">My Vocabulary Study List</h3>
    <button class="btn-danger" style="margin: 0;" onclick="clearStudyList()">Clear Study List</button>
  </div>
  <table class="study-table">
    <thead>
      <tr>
        <th style="width: 30%;">Word / Phrase in Context</th>
        <th style="width: 55%;">Dictionary Root & Translations</th>
        <th style="width: 15%; text-align: center;">Times Looked Up</th>
      </tr>
    </thead>
    <tbody id="studyListBody">
      <tr>
        <td colspan="3" class="empty-msg">No words saved to study list yet. Tap the [+] inside any translation bubble to start tracking.</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
// Declare your single runtime dictionary globally at the top
let runtimeGlossary = {};

// THE BARRICADE: Safe execution guard waiting for the loader's signal
window.addEventListener('dictionariesReady', () => {
  console.log("🚀 Signal received! Compiling initial active runtime glossary...");
  compileActiveGlossary();
});

// GLOSSARY PARSING ENGINE
function compileActiveGlossary() {
  runtimeGlossary = {};

  const useMynediad = document.getElementById('chkMynediad').checked;
  const useSylfaen = document.getElementById('chkSylfaen').checked;
  const useCanolradd = document.getElementById('chkCanolradd').checked;
  const useBBC = document.getElementById('chkBBC').checked;

  function mergeSource(sourceGlossary) {
    if (!sourceGlossary || typeof sourceGlossary !== 'object') return;

    for (const key in sourceGlossary) {
      const cleanKey = key.trim().toLowerCase();
      const rawData = sourceGlossary[key];

      let textTranslation = "";
      let courseInfo = "";

      // Smart hybrid check for object containers or flat strings
      if (rawData && typeof rawData === 'object' && 'definition' in rawData) {
        textTranslation = rawData.definition;
        if (rawData.course && rawData.unit) {
          courseInfo = ` [${rawData.course} • ${rawData.unit}]`;
        }
      } else {
        textTranslation = rawData;
      }

      const finalDisplayString = textTranslation + courseInfo;

      if (runtimeGlossary[cleanKey]) {
        const currentDefs = runtimeGlossary[cleanKey].split(" / ");
        if (!currentDefs.includes(finalDisplayString)) {
          runtimeGlossary[cleanKey] += " / " + finalDisplayString;
        }
      } else {
        runtimeGlossary[cleanKey] = finalDisplayString;
      }
    }
  }

  // Safely merge checkboxes to global variables populated by the fetch script
  if (useMynediad) mergeSource(window.mynediadGlossary);
  if (useSylfaen) mergeSource(window.sylfaenGlossary);
  if (useCanolradd) mergeSource(window.canolraddGlossary);
  if (useBBC) mergeSource(window.bbcGlossary);

  console.log("📊 Active glossary compiled. Total terms:", Object.keys(runtimeGlossary).length);
}

// --- AUTO-COLLECT MULTIPLE MATCHES & MUTATIONS ---
function collectMatches(word, glossary) {
  // FIXED: Explicitly preserves straight and curly apostrophes during word cleanup!
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F\u1E00-\u1EFF'’]+|[^\w\u00C0-\u017F\u1E00-\u1EFF'’]+$/g, "").trim();
  if (!w) return [];

  // 1. WELSH CONTRACTION SPLITTER
  // Only trim context attachments if the absolute contraction isn't explicitly in the glossary first!
  if (!glossary[w]) {
    if (w.endsWith("'r") || w.endsWith("’r") || w.endsWith("'n") || w.endsWith("’n")) {
      w = w.slice(0, -2); 
    }
  }

  // 2. WELSH VOWEL-LINK STRIPPER
  if (!glossary[w]) {
    const vowelLinks = { "nag": "na", "ac": "a", "ag": "â", "tuag": "tua", "gydag": "gyda" };
    if (vowelLinks[w]) w = vowelLinks[w];
  }

  if (!w) return [];
  let foundKeys = new Set();

  function checkAndAdd(candidate) {
    if (glossary[candidate]) foundKeys.add(candidate);
    if (/[aeiouwŷâêîôû]$/i.test(candidate)) {
      const candidateWithF = candidate + "f";
      if (glossary[candidateWithF]) foundKeys.add(candidateWithF);
    }
  }

  checkAndAdd(w);

  function scanMutations(candidate) {
    // Soft Mutations
    const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
    for (const mut in soft) {
      if (candidate.startsWith(mut)) {
        soft[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    // Nasal Mutations
    const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
    for (const mut in nasal) {
      if (candidate.startsWith(mut)) {
        nasal[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    // Aspirate Mutations
    const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
    for (const mut in aspirate) {
      if (candidate.startsWith(mut)) {
        aspirate[mut].forEach(target => checkAndAdd(candidate.replace(new RegExp("^" + mut), target)));
      }
    }

    if (/^[aeiouwŷâêîôû]/i.test(candidate)) checkAndAdd("g" + candidate);

    // ASPIRATE VOWEL PASS
    if (candidate.startsWith("h") && candidate.length > 1) {
      const vowelRoot = candidate.slice(1);
      if (/^[aeiouwŷâêîôû]/i.test(vowelRoot)) checkAndAdd(vowelRoot);
    }
  }

  scanMutations(w);

  // 3. VERB STEM SUFFIX STRIPPER
  const verbSuffixes = ["odd", "ais", "es", "aeth", "on", "och", "asant", "wch", "a"];
  for (const suffix of verbSuffixes) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      checkAndAdd(nakedStem);
      scanMutations(nakedStem);

      const infinitiveEndings = ["u", "i", "o", "io", "a"];
      for (const inf of infinitiveEndings) {
        let reconstructedVerb = nakedStem + inf;
        checkAndAdd(reconstructedVerb);
        scanMutations(reconstructedVerb);
      }
    }
  }
 // 4. FIXED LOCATION: ADJECTIVE COMPARATIVE / SUPERLATIVE Suffix Stripper
  // Targets regular endings, including modern spoken dropped-f superlatives!
  const adjSuffixes = { "ach": "comparative", "af": "superlative", "a": "superlative", "ed": "equative" };
  for (const [suffix, formType] of Object.entries(adjSuffixes)) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      
      // We will temporarily intercept found keys to attach the form label to them
      function checkAddWithForm(candidate) {
        if (glossary[candidate]) {
          foundKeys.add(JSON.stringify({ root: candidate, form: formType }));
        }
      }

      // Check standard mutations with the form tag attached
      checkAddWithForm(nakedStem);
      
      // Re-map scanMutations to use our form tracker inside this loop block
      const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
      for (const m in soft) if (nakedStem.startsWith(m)) soft[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));
      
      const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
      for (const m in nasal) if (nakedStem.startsWith(m)) nasal[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));
      
      const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
      for (const m in aspirate) if (nakedStem.startsWith(m)) aspirate[m].forEach(t => checkAddWithForm(nakedStem.replace(new RegExp("^" + m), t)));

      // Harden stem reversals (e.g., teca -> tec -> teg)
      if (nakedStem.endsWith("c")) { const s = nakedStem.slice(0, -1) + "g"; checkAddWithForm(s); }
      if (nakedStem.endsWith("t")) { const s = nakedStem.slice(0, -1) + "d"; checkAddWithForm(s); }
      if (nakedStem.endsWith("p")) { const s = nakedStem.slice(0, -1) + "b"; checkAddWithForm(s); }
    }
  }
  return Array.from(foundKeys).map(item => {
    if (item.startsWith("{")) {
      const parsed = JSON.parse(item);
      return { root: parsed.root, definition: glossary[parsed.root], form: parsed.form };
    }
    return { root: item, definition: glossary[item], form: "" };
  });
}

// --- AUTO-ANNOTATION ENGINE ---
function annotate(text, glossary) {
  const phrases = Object.keys(glossary).filter(key => key.includes(" "));
  phrases.sort((a, b) => b.length - a.length);

  let processedText = text;

  phrases.forEach(phrase => {
    const safePhrase = phrase.replace(/[-\/\\^\$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`\\b(${safePhrase})\\b`, 'gi');
    processedText = processedText.replace(regex, (match) => {
      return `___PHRASE_START___${match}___PHRASE_DIVIDER___${glossary[phrase]}___PHRASE_END___`;
    });
  });

  const tokens = processedText.split(/(___PHRASE_START___.*?___PHRASE_END___)/g);

  return tokens.map(token => {
    if (token.startsWith("___PHRASE_START___")) {
      const parts = token.replace("___PHRASE_START___", "").replace("___PHRASE_END___", "").split("___PHRASE_DIVIDER___");
      const textPhrase = parts[0];
      const translationPhrase = parts[1];
      const htmlTextContent = `<span class="tooltip-branch"><span class="tooltip-label">(${textPhrase}):</span> ${translationPhrase}</span>`;
      const cleanParam = `(${textPhrase}): ${translationPhrase}`.replace(/['"]/g, '&quot;');
      let addBtnHtml = `<button onclick="handleAddButtonClick(event, '${textPhrase}', '${cleanParam}')" style="display:block; width:100%; margin-top:8px; padding:4px; font-size:11px; background:#10b981; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">➕ Add to Study List</button>`;

      return `<span class="annotated" onclick="handleWordActivation(event, this, '${textPhrase}', '${cleanParam}')">${textPhrase}<span class="tooltip">${htmlTextContent}${addBtnHtml}</span></span>`;
    }

const words = token.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF\u2019\u0027]+)/g);
    return words.map(word => {
      const matches = collectMatches(word, glossary);
      if (matches.length > 0) {
         // 1. BUILD INTUITIVE VISUAL HOVER TOOLTIP TEXT WITH DUPLICATE DE-DUPLICATION
        let uniqueBranches = new Set();
        let tooltipHtml = matches.map(m => {
          const d = m.definition;
          const txt = (d && typeof d === 'object') ? d.definition : d;
          const c = (d && d.course) ? d.course : "";
          const u = (d && d.unit) ? d.unit : "";
          
          const formLabel = m.form ? ` (${m.form})` : "";
          const curriculum = (c || u) ? ` [${c} ${u ? '• ' + u : ''}]` : "";
          
          // Generate a unique signature for this specific definition text string
          const entrySignature = `${m.root}|||${txt}|||${formLabel}`;
          if (uniqueBranches.has(entrySignature)) return ""; // Skip if we already added it!
          uniqueBranches.add(entrySignature);
          
          return `<span class="tooltip-branch"><span class="tooltip-label">(${m.root}):</span> ${txt}${formLabel}${curriculum}</span>`;
        }).join("");

        // 2. STRUCTURALLY PACK THE DATA OBJECT FOR THE COMPACT STUDY TABLE
        const firstMatch = matches[0].definition;
        const packedData = {
          word: word,
          def: (firstMatch && typeof firstMatch === 'object') ? firstMatch.definition : firstMatch,
          course: (firstMatch && firstMatch.course) ? firstMatch.course : "",
          unit: (firstMatch && firstMatch.unit) ? firstMatch.unit : ""
        };
        const cleanParam = encodeURIComponent(JSON.stringify(packedData));
        
        let btn = `<button onclick="handleAddClick(event, '${cleanParam}')" style="display:block; width:100%; margin-top:8px; padding:4px; font-size:11px; background:#10b981; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">➕ Add to Study List</button>`;
        return `<span class="annotated" onclick="handleToggle(event, this)">${word}<span class="tooltip">${tooltipHtml}${btn}</span></span>`;
      }
      return word;
    }).join("");
  }).join("");
}

// --- LAYER INTERACTION HANDLERS ---
  function handleWordActivation(event, element, plainWord, encodedTranslation) {
  event.stopPropagation(); 
  const isOpen = element.classList.contains('show-tooltip');
  document.querySelectorAll('.annotated').forEach(el => el.classList.remove('show-tooltip'));
  if (!isOpen) element.classList.add('show-tooltip');
}

function handleAddButtonClick(event, plainWord, encodedTranslation) {
  event.stopPropagation(); 
  const cleanWord = plainWord.trim();
  let listCache = sessionStorage.getItem("welshActiveStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];
  const existingItemIndex = loggedWords.findIndex(item => item.word.toLowerCase() === cleanWord.toLowerCase());

  if (existingItemIndex !== -1) {
    loggedWords[existingItemIndex].count += 1;
  } else {
    let cellularRows = encodedTranslation.split(' / ').map(item => `<span class="table-branch-item">${item}</span>`).join('');
    loggedWords.push({ word: cleanWord, displayDef: cellularRows, count: 1 });
  }

  loggedWords.sort((a, b) => b.count - a.count);
  sessionStorage.setItem("welshActiveStudySession", JSON.stringify(loggedWords));
  renderStudyListTable();
  document.querySelectorAll('.annotated').forEach(el => el.classList.remove('show-tooltip'));
}

function renderStudyListTable() {
  const tableBody = document.getElementById("studyListBody");
  if (!tableBody) return; 
  
  let listCache = sessionStorage.getItem("welshActiveStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  if (loggedWords.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="3" class="empty-msg">No words saved yet. Tap [+] inside bubbles to track.</td></tr>`;
    return;
  }

  tableBody.innerHTML = loggedWords.map(item => `<tr>
    <td><span class="table-word">${item.word}</span></td>
    <td>${item.displayDef}</td>
    <td style="text-align: center; font-weight: bold; color: #dc3545; background-color: #fff5f5;">${item.count}×</td>
  </tr>`).join("");
}

// --- STANDARD LOCAL OFFLINE PROCESSING EXECUTION ---
function runAnnotation() {
  compileActiveGlossary();
  const text = document.getElementById("inputText").value;

  if (!text.trim()) {
    document.getElementById("output").innerHTML = "Please type some Welsh text first to annotate.";
    return;
  }

  const localAnnotatedHtml = annotate(text, runtimeGlossary);
  document.getElementById("output").innerHTML = localAnnotatedHtml;
}

function clearAnnotation() {
  document.getElementById("inputText").value = "";
  document.getElementById("output").innerHTML = "";
}

window.onload = function() {
  renderStudyListTable();
};

document.addEventListener('click', function() {
  document.querySelectorAll('.annotated').forEach(el => el.classList.remove('show-tooltip'));
});


</script>

<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">
<title>Welsh Auto‑Annotation Tool</title>

<!-- LINK YOUR EXTERNAL GLOSSARIES HERE -->
<script src="mynediad.js"></script>
<script src="sylfaen.js"></script>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    line-height: 1.6;
    padding: 0 20px;
  }

  .control-panel {
    background: #f4f6f9;
    padding: 15px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    margin-bottom: 20px;
  }

  .checkbox-group {
    display: flex;
    gap: 20px;
    margin-top: 8px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: normal;
    cursor: pointer;
    font-size: 1em;
  }

  .checkbox-label input {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  textarea {
    width: 100%;
    height: 150px;
    font-size: 1em;
    margin-bottom: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px;
  }

  .btn-primary {
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
    background-color: #0056b3;
    color: white;
    border: none;
    border-radius: 4px;
    margin-bottom: 20px;
  }

  .btn-primary:hover {
    background-color: #004085;
  }

  .annotated {
    position: relative;
    cursor: help;
    border-bottom: 1px dotted #888;
  }

  .tooltip {
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s;
    position: absolute;
    bottom: 120%;
    left: 0;
    background: #333;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  .annotated:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }

  /* Styling for multiple choices inside a tooltip */
  .tooltip-branch {
    display: block;
    border-bottom: 1px dashed #555;
    padding: 2px 0;
  }
  .tooltip-branch:last-child {
    border-bottom: none;
  }
  .tooltip-label {
    color: #a7f3d0;
    font-size: 0.85em;
    font-weight: bold;
    margin-right: 5px;
  }
  
  label {
    font-weight: bold;
    display: block;
    margin-bottom: 5px;
  }
</style>
</head>

<body>

<h2>Welsh Auto‑Annotation Tool</h2>

<!-- CONTROL PANEL -->
<div class="control-panel">
  <label>Select Vocabulary Levels to Include:</label>
  <div class="checkbox-group">
    <label class="checkbox-label">
      <input type="checkbox" id="chkMynediad" checked> Mynediad (Entry level)
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="chkSylfaen" checked> Sylfaen (Foundation level)
    </label>
  </div>
</div>
  
<!-- MAIN TEXT AREA -->
<label for="inputText">Welsh Text to Annotate:</label>
<textarea id="inputText" placeholder="Rhowch eich testun Cymraeg yma..."></textarea>
<button class="btn-primary" onclick="runAnnotation()">Annotate Text</button>

<div id="output"></div>

<script>
let runtimeGlossary = {};

function compileActiveGlossary() {
  runtimeGlossary = {};
  
  const useMynediad = document.getElementById('chkMynediad').checked;
  const useSylfaen = document.getElementById('chkSylfaen').checked;
  
  // Helper function to safely merge words into our active runtime dictionary
  function mergeSource(sourceGlossary) {
    if (typeof sourceGlossary === 'undefined') return;
    
    for (const key in sourceGlossary) {
      const cleanKey = key.trim().toLowerCase();
      const translation = sourceGlossary[key];
      
      if (runtimeGlossary[cleanKey]) {
        // IF THE WORD ALREADY EXISTS: Check if this specific translation is unique
        const currentDefs = runtimeGlossary[cleanKey].split(" / ");
        if (!currentDefs.includes(translation)) {
          // Append the new definition using a clean divider
          runtimeGlossary[cleanKey] += " / " + translation;
        }
      } else {
        // IF THE WORD IS NEW: Just add it normally
        runtimeGlossary[cleanKey] = translation;
      }
    }
  }

  // Safely blend inputs sequentially without hard overwrites
  if (useMynediad) mergeSource(mynediadGlossary);
  if (useSylfaen) mergeSource(sylfaenGlossary);
}

// --- AUTO-COLLECT MULTIPLE MATCHES & MUTATIONS ---
function collectMatches(word, glossary) {
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F\u1E00-\u1EFF]+|[^\w\u00C0-\u017F\u1E00-\u1EFF]+$/g, "");
  if (!w) return [];

  // Use a Set to gather unique matched glossary root keys
  let foundKeys = new Set();

  // 1. Direct match check
  if (glossary[w]) foundKeys.add(w);

  // Helper inside to check mutation maps
  function scanMutations(candidate) {
    // Soft Mutations
    const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
    for (const mut in soft) {
      if (candidate.startsWith(mut)) {
        soft[mut].forEach(target => {
          const root = candidate.replace(new RegExp("^" + mut), target);
          if (glossary[root]) foundKeys.add(root);
        });
      }
    }

    // Nasal Mutations
    const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
    for (const mut in nasal) {
      if (candidate.startsWith(mut)) {
        nasal[mut].forEach(target => {
          const root = candidate.replace(new RegExp("^" + mut), target);
          if (glossary[root]) foundKeys.add(root);
        });
      }
    }

    // Aspirate Mutations
    const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
    for (const mut in aspirate) {
      if (candidate.startsWith(mut)) {
        aspirate[mut].forEach(target => {
          const root = candidate.replace(new RegExp("^" + mut), target);
          if (glossary[root]) foundKeys.add(root);
        });
      }
    }

    // Dropped 'G' Pass
    if (/^[aeiouwŷâêîôû]/i.test(candidate)) {
      const addedG = "g" + candidate;
      if (glossary[addedG]) foundKeys.add(addedG);
    }
  }

  // Scan mutations on the base word shape
  scanMutations(w);

  // 2. Verb stem processing
  const verbSuffixes = ["odd", "ais", "es", "aeth", "on", "och", "asant"];
  for (const suffix of verbSuffixes) {
    if (w.endsWith(suffix) && w.length > suffix.length) {
      const nakedStem = w.slice(0, -suffix.length);
      
      if (glossary[nakedStem]) foundKeys.add(nakedStem);
      scanMutations(nakedStem);

      const infinitiveEndings = ["u", "i", "o", "io", "a"];
      for (const inf of infinitiveEndings) {
        let reconstructedVerb = nakedStem + inf;
        if (glossary[reconstructedVerb]) foundKeys.add(reconstructedVerb);
        scanMutations(reconstructedVerb);
      }
    }
  }

  // Convert Set back to an array of objects holding the root word and its definition
  return Array.from(foundKeys).map(key => {
    return { root: key, definition: glossary[key] };
  });
}

// --- AUTO‑ANNOTATION ENGINE ---
function annotate(text, glossary) {
  const phrases = Object.keys(glossary).filter(key => key.includes(" "));
  phrases.sort((a, b) => b.length - a.length);

  let processedText = text;

  phrases.forEach(phrase => {
    const safePhrase = phrase.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`\\b(${safePhrase})\\b`, 'gi');
    
    processedText = processedText.replace(regex, (match) => {
      return `___PHRASE_START___${match}___PHRASE_DIVIDER___${glossary[phrase]}___PHRASE_END___`;
    });
  });

  const tokens = processedText.split(/(___PHRASE_START___.*?___PHRASE_END___)/g);
  
  return tokens.map(token => {
    if (token.startsWith("___PHRASE_START___")) {
      const parts = token.replace("___PHRASE_START___", "").replace("___PHRASE_END___", "").split("___PHRASE_DIVIDER___");
      return `<span class="annotated">${parts[0]}<span class="tooltip">${parts[1]}</span></span>`;
    }

    const words = token.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF\u2019\u0027]+)/g);
    return words.map(word => {
      const matches = collectMatches(word, glossary);
      
      // If we found one or more definitions, stack them neatly inside the tooltip!
      if (matches.length > 0) {
        let tooltipContent = matches.map(m => {
          return `<span class="tooltip-branch"><span class="tooltip-label">(${m.root}):</span> ${m.definition}</span>`;
        }).join("");

        return `<span class="annotated">${word}<span class="tooltip">${tooltipContent}</span></span>`;
      }
      return word;
    }).join("");
  }).join("");
}

// --- RUN ANNOTATION ---
function runAnnotation() {
  compileActiveGlossary();
  const text = document.getElementById("inputText").value;
  document.getElementById("output").innerHTML = annotate(text, runtimeGlossary);
}
</script>

</body>
</html>

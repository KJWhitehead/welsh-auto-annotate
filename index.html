<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">
<title>Welsh Auto‑Annotation Tool</title>

<style>
  body {
    font-family: sans-serif;
    max-width: 700px;
    margin: 40px auto;
    line-height: 1.6;
  }

  textarea {
    width: 100%;
    height: 150px;
    font-size: 1em;
    margin-bottom: 10px;
  }

  button {
    padding: 8px 16px;
    font-size: 1em;
    cursor: pointer;
  }

  .annotated {
    position: relative;
    cursor: help;
    border-bottom: 1px dotted #888;
  }

  .tooltip {
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.2s;
    position: absolute;
    bottom: 120%;
    left: 0;
    background: #333;
    color: #fff;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 10;
  }

  .annotated:hover .tooltip {
    visibility: visible;
    opacity: 1;
  }
</style>
</head>

<body>

<h2>Welsh Auto‑Annotation Tool</h2>

<p>Paste any Welsh text below and click <strong>Annotate</strong>:</p>

<textarea id="inputText" placeholder="Rhowch eich testun Cymraeg yma..."></textarea>
<button onclick="runAnnotation()">Annotate</button>

<div id="output"></div>

<script>
// --- YOUR WELSH GLOSSARY ---
const glossary = {
  // A2 verbs
  "mynd": "to go",
  "dod": "to come",
  "gweld": "to see",
  "rhoi": "to give / put",
  "cymryd": "to take",
  "gofyn": "to ask",
  "ateb": "to answer",
  "bod": "to be",
  "cael": "to get / have",
  "dweud": "to say / tell",

  // A2 nouns
  "tŷ": "house",
  "parc": "park",
  "drws": "door",
  "car": "vehicle",
  "boced": "pocket",
  "pêl": "ball",
  "coed": "trees / woods",
  "heddlu": "police",
  "bachgen": "boy",
  "merch": "girl",

  // A2 adjectives
  "hapus": "happy",
  "sâl": "ill",
  "mawr": "big",
  "bach": "small",

  // A2 function words
  "wrth": "at / by",
  "gyda": "with",
  "i": "to",
  "yn": "in / -ing marker",
  "ar": "on",

  // B1 verbs
  "gofalodd": "he made sure / took care",
  "ymddangos": "to appear",
  "symud": "to move",
  "edrych": "to look",
  "teimlo": "to feel",
  "credu": "to believe",
  "disgrifio": "to describe",

  // B1 nouns
  "sylw": "attention / notice",
  "achos": "cause / case",
  "rheswm": "reason",
  "sŵn": "noise",
  "golwg": "sight / view",
  "teimlad": "feeling",

  // B1 adjectives
  "pryderus": "worried",
  "difrifol": "serious",
  "arall": "other",
  "cyflym": "fast",

  // B1 connectors
  "felly": "so / therefore",
  "er hynny": "nevertheless",
  "hefyd": "also",
  "oherwydd": "because"
};


// --- SAFE WELSH MUTATION NORMALISATION ---
function normalise(word, glossary) {
  let w = word.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, "");

  // 1. Try exact match
  if (glossary[w]) return w;

  // 2. Soft mutation reversals
  const soft = {
    "f": "b",
    "dd": "d",
    "g": "c",
    "ph": "p",
    "th": "t"
  };
  for (const mut in soft) {
    if (w.startsWith(mut)) {
      const candidate = w.replace(new RegExp("^" + mut), soft[mut]);
      if (glossary[candidate]) return candidate;
    }
  }

  // 3. Nasal mutation reversals
  const nasal = {
    "mh": "m",
    "nh": "n",
    "ngh": "c",
    "ng": "g"
  };
  for (const mut in nasal) {
    if (w.startsWith(mut)) {
      const candidate = w.replace(new RegExp("^" + mut), nasal[mut]);
      if (glossary[candidate]) return candidate;
    }
  }

  // 4. Aspirate mutation reversals
  const aspirate = {
    "ch": "c",
    "ll": "l",
    "rh": "r"
  };
  for (const mut in aspirate) {
    if (w.startsWith(mut)) {
      const candidate = w.replace(new RegExp("^" + mut), aspirate[mut]);
      if (glossary[candidate]) return candidate;
    }
  }

  // 5. No match found
  return w;
}


// --- AUTO‑ANNOTATION ENGINE WITH MUTATION SUPPORT ---
function annotate(text, glossary) {
  const words = text.split(/\b/);
  return words.map(word => {
    const clean = normalise(word, glossary);
    if (glossary[clean]) {
      return `
        <span class="annotated">${word}
          <span class="tooltip">${glossary[clean]}</span>
        </span>`;
    }
    return word;
  }).join("");
}


// --- RUN ANNOTATION ---
function runAnnotation() {
  const text = document.getElementById("inputText").value;
  document.getElementById("output").innerHTML = annotate(text, glossary);
}
</script>

</body>
</html>

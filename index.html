<!DOCTYPE html>
<html lang="cy">
<head>
<meta charset="UTF-8">

<title>Welsh Auto‑Annotation Tool</title>

<!-- EXTERNAL GLOSSARIES-->
<script>
  (async function loadDictionaries() {
    // Relative paths to your modern JSON files
    const files = {
      mynediadGlossary: 'dictionaries/mynediad.json',
      sylfaenGlossary: 'dictionaries/sylfaen.json',
      canolraddGlossary: 'dictionaries/canolradd.json',
      bbcGlossary: 'dictionaries/bbc.json'
    };

    for (const [globalName, path] of Object.entries(files)) {
      try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        // Bind the clean data directly to the global window context
        window[globalName] = await response.json();
      } catch (error) {
        console.error(`Failed to load local dictionary from ${path}:`, error);
      }
    }
    
    console.log("✅ All Welsh JSON dictionaries loaded successfully into the window context.");
    
    // Yell to the page that the data is ready to use!
    window.dispatchEvent(new Event('dictionariesReady'));
  })();
</script>


</head>

    </label>

<!-- MAIN TEXT AREA -->

<!-- LAYER 3: DYNAMIC STUDY LIST VIEW (UPDATED FOR 3 COLUMNS) -->
<div class="study-list-container">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dee2e6; padding-bottom: 8px; margin-bottom: 15px;">
    <h3 style="margin: 0;">My Vocabulary Study List</h3>
    <div style="display: flex; gap: 10px;">
      <!-- FIXED: The new blue XML downloader action button -->
      <button class="btn-primary" style="margin: 0; background-color: #3b82f6;" onclick="triggerXMLExport()">📥 Export to XML</button>
      <button class="btn-danger" style="margin: 0;" onclick="clearStudyList()">Clear Study List</button>
    </div>
  </div>

  <table class="study-table">
    <thead>
      <tr>
        <th style="width: 25%;">Word / Phrase</th>
        <th style="width: 45%;">Definition Mapping</th>
        <!-- FIXED: The structural 4th column header for curriculum units -->
        <th style="width: 20%;">Curriculum Source</th>
        <th style="width: 10%; text-align: center;">Count</th>
      </tr>
    </thead>
    <tbody id="studyListBody">
      <!-- Fixed cell count: spanning across all 4 columns for clean alignments -->
      <tr>
        <td colspan="4" class="empty-msg">No words saved to study list yet. Tap the [+] inside any translation bubble to start tracking.</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
// Global initialization runtime database cache variables
let runtimeGlossary = {};

// Listen for the signal from the <head> that data is ready
window.addEventListener('dictionariesReady', () => {
  compileActiveGlossary();
  renderStudyListTable();
});

function compileActiveGlossary() {
  runtimeGlossary = {};
  const sets = [
    { chk: 'chkMynediad', data: window.mynediadGlossary },
    { chk: 'chkSylfaen', data: window.sylfaenGlossary },
    { chk: 'chkCanolradd', data: window.canolraddGlossary },
    { chk: 'chkBBC', data: window.bbcGlossary }
  ];

  sets.forEach(set => {
    const checkbox = document.getElementById(set.chk);
    if (checkbox && checkbox.checked && set.data) {
      for (const key in set.data) {
        const cleanKey = key.trim().toLowerCase();
        runtimeGlossary[cleanKey] = set.data[key];
      }
    }
  });
  console.log("📊 Active glossary compiled. Total keys:", Object.keys(runtimeGlossary).length);
}

// --- TOKENIZER MATRIX ENGINE ---
function collectMatches(word, glossary) {
  let w = word.toLowerCase().replace(/^[^\w\u00C0-\u017F\u1E00-\u1EFF]+|[^\w\u00C0-\u017F\u1E00-\u1EFF]+\$/g, "");
  if (!w) return [];

  if (w.endsWith("'r") || w.endsWith("’r") || w.endsWith("'n") || w.endsWith("’n")) w = w.slice(0, -2);
  if (!w) return [];

  let foundKeys = new Set();
  function checkAndAdd(candidate) {
    if (glossary[candidate]) foundKeys.add(candidate);
  }

  checkAndAdd(w);

  // Soft/Nasal/Aspirate mutation matrices checks
  const soft = { "g": ["c"], "b": ["p"], "d": ["t"], "f": ["b", "m"], "dd": ["d"], "l": ["ll"], "r": ["rh"] };
  for (const m in soft) if (w.startsWith(m)) soft[m].forEach(t => checkAndAdd(w.replace(new RegExp("^" + m), t)));

  const nasal = { "ngh": ["c"], "mh": ["p"], "nh": ["t"], "ng": ["g"], "m": ["b"], "n": ["d"] };
  for (const m in nasal) if (w.startsWith(m)) nasal[m].forEach(t => checkAndAdd(w.replace(new RegExp("^" + m), t)));

  const aspirate = { "ch": ["c"], "ph": ["p"], "th": ["t"] };
  for (const m in aspirate) if (w.startsWith(m)) aspirate[m].forEach(t => checkAndAdd(w.replace(new RegExp("^" + m), t)));

  if (/^[aeiouwŷâêîôû]/i.test(w)) checkAndAdd("g" + w);
  if (w.startsWith("h") && w.length > 1 && /^[aeiouwŷâêîôû]/i.test(w.slice(1))) checkAndAdd(w.slice(1));

  return Array.from(foundKeys).map(key => ({ root: key, definition: glossary[key] }));
}

function annotate(text, glossary) {
  const phrases = Object.keys(glossary).filter(k => k.includes(" ")).sort((a, b) => b.length - a.length);
  let processedText = text;

  phrases.forEach(phrase => {
    const safePhrase = phrase.replace(/[-\/\\^\$*+?.()|[\]{}]/g, '\\$&');
    const regex = new RegExp(`(?<=^|[^a-zA-Z\\u00C0-\u017F\\u1E00-\u1EFF])(${safePhrase})(?=$|[^a-zA-Z\\u00C0-\u017F\\u1E00-\u1EFF])`, 'gi');
    processedText = processedText.replace(regex, match => {
      const d = glossary[phrase];
      const txt = (d && typeof d === 'object') ? d.definition : d;
      const c = (d && d.course) ? d.course : "N/A";
      const u = (d && d.unit) ? d.unit : "N/A";
      return `___PHRASE_START___${match}___PHRASE_DIVIDER___${txt}|||${c}|||${u}___PHRASE_END___`;
    });
  });

  const tokens = processedText.split(/(___PHRASE_START___.*?___PHRASE_END___)/g);
  return tokens.map(token => {
    if (token.startsWith("___PHRASE_START___")) {
      const parts = token.replace("___PHRASE_START___", "").replace("___PHRASE_END___", "").split("___PHRASE_DIVIDER___");
      const phraseText = parts[0];
      const dataBits = parts[1].split("|||");
      
      const tooltipHtml = `<span class="tooltip-branch"><span class="tooltip-label">(${phraseText}):</span> ${dataBits[0]} [${dataBits[1]} • ${dataBits[2]}]</span>`;
      const cleanParam = encodeURIComponent(JSON.stringify({ word: phraseText, def: dataBits[0], course: dataBits[1], unit: dataBits[2] }));
      let btn = `<button onclick="handleAddClick(event, '${cleanParam}')" style="display:block; width:100%; margin-top:8px; padding:4px; font-size:11px; background:#10b981; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">➕ Add to Study List</button>`;
      return `<span class="annotated" onclick="handleToggle(event, this)">${phraseText}<span class="tooltip">${tooltipHtml}${btn}</span></span>`;
    }

    const words = token.split(/([a-zA-Z\u00C0-\u017F\u1E00-\u1EFF\u2019\u0027]+)/g);
    return words.map(word => {
      const matches = collectMatches(word, glossary);
      if (matches.length > 0) {
        let tooltipHtml = matches.map(m => {
          const d = m.definition;
          const txt = (d && typeof d === 'object') ? d.definition : d;
          const c = (d && d.course) ? d.course : "N/A";
          const u = (d && d.unit) ? d.unit : "N/A";
          return `<span class="tooltip-branch"><span class="tooltip-label">(${m.root}):</span> ${txt} [${c} • ${u}]</span>`;
        }).join("");

        const firstMatch = matches[0].definition;
        const packedData = {
          word: word,
          def: (firstMatch && typeof firstMatch === 'object') ? firstMatch.definition : firstMatch,
          course: (firstMatch && firstMatch.course) ? firstMatch.course : "N/A",
          unit: (firstMatch && firstMatch.unit) ? firstMatch.unit : "N/A"
        };
        const cleanParam = encodeURIComponent(JSON.stringify(packedData));
        let btn = `<button onclick="handleAddClick(event, '${cleanParam}')" style="display:block; width:100%; margin-top:8px; padding:4px; font-size:11px; background:#10b981; color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;">➕ Add to Study List</button>`;
        return `<span class="annotated" onclick="handleToggle(event, this)">${word}<span class="tooltip">${tooltipHtml}${btn}</span></span>`;
      }
      return word;
    }).join("");
  }).join("");
}

// --- INTERACTION & DATA STORAGE PIPELINES ---
function handleToggle(event, el) {
  event.stopPropagation();
  const isOpen = el.classList.contains('show-tooltip');
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
  if (!isOpen) el.classList.add('show-tooltip');
}

function handleAddClick(event, encodedData) {
  event.stopPropagation();
  const data = JSON.parse(decodeURIComponent(encodedData));
  
  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  const matchIdx = loggedWords.findIndex(item => item.word.toLowerCase() === data.word.toLowerCase());
  if (matchIdx !== -1) {
    loggedWords[matchIdx].count += 1;
  } else {
    loggedWords.push({ word: data.word, displayDef: data.def, course: data.course, unit: data.unit, count: 1 });
  }

  localStorage.setItem("welshLocalStudySession", JSON.stringify(loggedWords));
  renderStudyListTable();
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
}

function renderStudyListTable() {
  const tableBody = document.getElementById("studyListBody");
  if (!tableBody) return;

  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  if (loggedWords.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="4" class="empty-msg">No words saved yet. Tap [+] to track.</td></tr>`;
    return;
  }

  tableBody.innerHTML = loggedWords.map(item => `<tr>
    <td><span class="table-word">${item.word}</span></td>
    <td>${item.displayDef}</td>
    <td><span class="unit-tag">${item.course} • ${item.unit}</span></td>
    <td style="text-align: center; font-weight: bold; color: #dc3545;">${item.count}×</td>
  </tr>`).join("");
}

// --- SYSTEM XML EXPORT CONTROLLER ---
function triggerXMLExport() {
  let listCache = localStorage.getItem("welshLocalStudySession");
  let loggedWords = listCache ? JSON.parse(listCache) : [];

  if (loggedWords.length === 0) {
    alert("Your study list is currently empty. Add some words first!");
    return;
  }

  let xmlString = `<?xml version="1.0" encoding="UTF-8"?>\n<studylist>\n`;
  loggedWords.forEach(item => {
    xmlString += `  <item>\n`;
    xmlString += `    <word>${escapeXML(item.word)}</word>\n`;
    xmlString += `    <definition>${escapeXML(item.displayDef)}</definition>\n`;
    xmlString += `    <course>${escapeXML(item.course)}</course>\n`;
    xmlString += `    <unit>${escapeXML(item.unit)}</unit>\n`;
    xmlString += `    <count>${item.count}</count>\n`;
    xmlString += `  </item>\n`;
  });
  xmlString += `</studylist>`;

  const blob = new Blob([xmlString], { type: "text/xml" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "welsh_vocabulary_study_list.xml";
  link.click();
}

function escapeXML(str) {
  if (!str) return "";
  return str.toString()
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function runAnnotation() {
  const text = document.getElementById("inputText").value;
  if (!text.trim()) {
    document.getElementById("output").innerHTML = "Please type some Welsh text first.";
    return;
  }
  document.getElementById("output").innerHTML = annotate(text, runtimeGlossary);
}

function clearAnnotation() {
  document.getElementById("inputText").value = "";
  document.getElementById("output").innerHTML = "";
}

function clearStudyList() {
  if (confirm("Are you sure you want to clear your current vocabulary study list?")) {
    localStorage.removeItem("welshLocalStudySession");
    renderStudyListTable();
  }
}

document.addEventListener('click', () => {
  document.querySelectorAll('.annotated').forEach(x => x.classList.remove('show-tooltip'));
});
</script>
